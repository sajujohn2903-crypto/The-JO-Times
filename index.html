<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The JO Times — John Saju, UI/UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="cursor" id="cursor" aria-hidden="true">View &rarr;</div>

<!-- halftone press blocks (screen patterns + portrait plate) -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <defs>
    <pattern id="scr-hi" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="4.35" fill="#363536"/>
    </pattern>
    <pattern id="scr-mid" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="2.7" fill="#363536"/>
    </pattern>
    <pattern id="scr-lo" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.05" fill="#363536"/>
    </pattern>
    <symbol id="portrait" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
      <rect width="800" height="1000" fill="#B2ADAD"/>
      <g transform="translate(400 560) scale(1.1) translate(-400 -560)">
        <path d="M-100 1000c0-206 214-318 500-318s500 112 500 318z" fill="url(#scr-hi)"/>
        <path d="M312 500h176v230H312z" fill="url(#scr-mid)"/>
        <ellipse cx="400" cy="404" rx="207" ry="258" fill="url(#scr-mid)"/>
        <ellipse cx="386" cy="424" rx="132" ry="178" fill="#B2ADAD"/>
        <ellipse cx="386" cy="424" rx="132" ry="178" fill="url(#scr-lo)"/>
        <path d="M193 420c-10-206 82-302 207-302s217 96 207 302c-14-118-58-172-146-190-40-8-72 18-104 38-58 36-136 34-164 152z" fill="url(#scr-hi)"/>
        <path d="M168 1000c10-152 62-240 152-272l80 92 80-92c90 32 142 120 152 272z" fill="#B2ADAD"/>
        <path d="M168 1000c10-152 62-240 152-272l80 92 80-92c90 32 142 120 152 272z" fill="url(#scr-mid)"/>
        <path d="M320 728 400 820 480 728 400 700z" fill="#B2ADAD"/>
        <path d="M320 728 400 820 480 728" fill="none" stroke="#363536" stroke-width="3.5" opacity=".55"/>
        <path d="M-100 1000c0-206 214-318 500-318" fill="none" stroke="#363536" stroke-width="3" opacity=".4"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="shell">

  <!-- ============ HEADER (masthead + nav) ============ -->
  <header id="front">
    <div class="topbar mono">
      <span id="topbar-left"></span>
      <span id="topbar-right"></span>
    </div>

    <div class="masthead">
      <div>
        <h1 class="masthead__title" id="masthead-title"><span class="rvl"><span id="masthead-title-text"></span></span></h1>
        <div class="masthead__sub">
          <span class="mono" id="masthead-role"></span>
          <span class="mono mono--mute" id="masthead-tagline"></span>
        </div>
      </div>
      <div class="masthead__meta mono fade" style="--d:340ms" id="masthead-meta"></div>
    </div>

    <nav class="nav" aria-label="Sections">
      <ul class="nav__list">
        <li><a href="#work">Works</a></li>
        <li><a href="#about">About Me</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <p class="nav__status mono"><span class="dot"></span> <span id="nav-status"></span></p>
    </nav>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero" aria-labelledby="lede">
    <div class="hero__left">
      <p class="kicker mono mono--l fade" id="hero-kicker"></p>
      <h2 id="lede" class="hero__h1"><span class="rvl"><span id="hero-h1" style="--d:120ms"></span></span></h2>
      <p class="hero__dek fade" style="--d:520ms" id="hero-dek"></p>
      <div class="hero__cta fade" style="--d:640ms">
        <a class="link" href="#work" data-cursor="Scroll &darr;">See the work <span class="arw">&rarr;</span></a>
        <div class="hero__byline mono" id="hero-byline"></div>
      </div>
    </div>

    <div class="hero__right">
      <figure>
        <div class="portrait hero__plate">
          <div class="press" style="--d:420ms"><svg viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Halftone portrait"><use href="#portrait"/></svg></div>
        </div>
        <figcaption class="hero__caption">
          <p id="hero-cap1"></p>
          <p id="hero-cap2"></p>
        </figcaption>
      </figure>
    </div>
  </section>

  <!-- ============ STAT STRIP ============ -->
  <section class="strip" aria-label="Edition at a glance" id="stat-strip"></section>

  <!-- ============ AWARD (editorial note) ============ -->
  <section class="band note" aria-labelledby="note-h" id="award-note">
    <p class="note__label mono mono--l" id="award-eyebrow"></p>
    <div>
      <h2 id="note-h"><span class="rvl"><span id="award-headline"></span></span></h2>
      <div class="note__body">
        <figure class="note__fig fade" style="--d:140ms">
          <div class="plate note__plate">
            <img id="award-photo-img" alt="" style="display:none;">
            <div class="plate__icon" id="award-photo-placeholder"></div>
          </div>
          <figcaption><span id="award-photo-caption"></span></figcaption>
        </figure>
        <div class="note__cols fade" style="--d:260ms">
          <p id="award-excerpt"></p>
          <p id="award-excerpt2"></p>
          <div class="note__more">
            <button class="link" id="award-read-more">Read the article <span class="arw">&rarr;</span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ WORKS TEASER ============ -->
  <section class="band" id="work" aria-labelledby="work-h">
    <div class="sechead">
      <h2 id="work-h"><span class="rvl"><span id="works-title"></span></span></h2>
      <div class="sechead__meta mono" id="works-meta"></div>
    </div>
    <div class="teaser" style="margin-top:clamp(28px,3.4vw,56px)">
      <div>
        <p class="teaser__dek fade" id="works-blurb"></p>
        <div class="teaser__cta fade">
          <a class="link" id="works-read-more" href="works.html" data-cursor="View &rarr;">Explore the works <span class="arw">&rarr;</span></a>
        </div>
      </div>
      <figure class="teaser__plate-wrap fade" style="--d:140ms">
        <div class="plate teaser__plate">
          <img id="works-photo-img" alt="" style="display:none;">
          <div class="plate__icon" id="works-photo-placeholder"></div>
        </div>
        <figcaption><span id="works-photo-caption"></span></figcaption>
      </figure>
    </div>
  </section>

  <!-- ============ ABOUT TEASER ============ -->
  <section class="band" id="about" aria-labelledby="about-h">
    <div class="sechead" style="margin-bottom:clamp(28px,3.4vw,56px)">
      <p class="mono mono--l mono--red" id="about-eyebrow"></p>
      <div class="sechead__meta mono" id="about-meta"></div>
    </div>
    <div class="teaser teaser--flip">
      <figure class="teaser__plate-wrap fade" style="--d:140ms">
        <div class="plate teaser__plate">
          <img id="about-photo-img" alt="" style="display:none;">
          <div class="plate__icon" id="about-photo-placeholder"></div>
        </div>
        <figcaption><span id="about-photo-caption"></span></figcaption>
      </figure>
      <div>
        <h2 id="about-h"><span class="rvl"><span id="about-headline"></span></span></h2>
        <p class="teaser__dek fade" style="--d:260ms" id="about-short"></p>
        <div class="teaser__cta fade" style="--d:320ms">
          <a class="link" id="about-read-more" href="about.html" data-cursor="Read &rarr;">Read the full story <span class="arw">&rarr;</span></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ EXPERTISE ============ -->
  <section class="band" id="expertise" aria-labelledby="expertise-h">
    <div class="sechead">
      <h2 id="expertise-h"><span class="rvl"><span id="expertise-title"></span></span></h2>
      <div class="sechead__meta mono" id="expertise-meta"></div>
    </div>
    <div class="index" role="list" id="expertise-grid" style="margin-top:clamp(26px,3vw,48px)"></div>
  </section>

  <!-- ============ TOOLS ============ -->
  <section class="band band--tight" id="tools" aria-label="Tools">
    <div class="sechead" style="margin-bottom:clamp(20px,2.4vw,32px)">
      <p class="mono mono--l mono--red">Toolkit</p>
      <div class="sechead__meta mono">Software &amp; Apps</div>
    </div>
    <div class="strip" id="tools-strip"></div>
  </section>

  <!-- ============ CONTACT ============ -->
  <section class="band" id="contact" aria-labelledby="contact-h">
    <div class="contact">
      <div>
        <p class="mono mono--l mono--red" style="margin-bottom:1.4em">Letters</p>
        <h2 id="contact-h">
          <span class="rvl"><span>Write to</span></span>
          <span class="rvl"><span style="--d:90ms">the <em>editor.</em></span></span>
        </h2>
        <p class="contact__dek fade" style="--d:200ms" id="contact-lede"></p>
        <div class="contact__cta fade" style="--d:300ms">
          <a class="link" id="contact-email-cta" data-cursor="Write &rarr;">Get in touch <span class="arw">&rarr;</span></a>
        </div>
      </div>

      <div class="channels mono" id="contact-channels"></div>
    </div>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="foot">
    <div class="foot__top">
      <p class="foot__mast" id="foot-mast"></p>
      <div class="foot__meta mono" id="foot-meta"></div>
    </div>
    <p class="endmark"><span>End of edition</span></p>
  </footer>

</div>

<script src="config.js"></script>
<script>
/* ================================================================
   RENDER — builds the DOM from CONFIG (defined in config.js).
   No need to edit below unless you want to change structure/behaviour.
   ================================================================ */

/* ---------- small icon set (line-art, monochrome, matches the ink) ---------- */
function iconSVG(kind){
  const s = 'stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const wrap = inner => `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  switch(kind){
    case 'award':
      return wrap(`<circle cx="50" cy="38" r="22" ${s}/><path d="M38 58 L28 90 L50 78 L72 90 L62 58" ${s}/>`);
    case 'works':
      return wrap(`<rect x="14" y="20" width="72" height="52" rx="2" ${s}/><path d="M14 34h72" ${s}/><circle cx="24" cy="27" r="2" fill="var(--ink)"/><circle cx="32" cy="27" r="2" fill="var(--ink)"/><path d="M26 48h30M26 58h20" ${s}/>`);
    case 'about':
      return wrap(`<circle cx="50" cy="36" r="16" ${s}/><path d="M18 88c0-24 14-38 32-38s32 14 32 38" ${s}/>`);
    default: return wrap('');
  }
}
function toolIcon(logo){
  if(logo === 'figma'){
    return `<svg viewBox="0 0 16 24" xmlns="http://www.w3.org/2000/svg" fill="var(--ink)">
      <path d="M0,8 L0,4 A4,4 0 0 1 8,4 L8,8 Z"/>
      <rect x="0" y="8" width="8" height="8"/>
      <path d="M0,16 L8,16 L8,20 A4,4 0 0 1 0,20 Z"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="12" cy="20" r="4"/>
    </svg>`;
  }
  const monograms = { photoshop:'Ps', premiere:'Pr', aftereffects:'Ae' };
  return `<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <rect x="1.5" y="1.5" width="37" height="37" rx="6" fill="none" stroke="var(--ink)" stroke-width="2.4"/>
    <text x="20" y="26" text-anchor="middle" font-family="var(--display)" font-weight="700" font-size="15" fill="var(--ink)">${monograms[logo] || '?'}</text>
  </svg>`;
}

/* ---------- header / masthead ---------- */
document.getElementById('topbar-left').textContent = `${CONFIG.name} — Independent Design Portfolio`;
document.getElementById('topbar-right').textContent = CONFIG.tagline;
document.getElementById('masthead-title-text').innerHTML = `THE <span class="amp">${CONFIG.maskheadShort}</span> TIMES`;
document.getElementById('masthead-role').textContent = CONFIG.role;
document.getElementById('masthead-tagline').textContent = CONFIG.tagline;

const today = new Date();
const todayStr = today.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
document.getElementById('masthead-meta').innerHTML = `
  <span>${CONFIG.issueLine}</span>
  <span class="now">${todayStr}</span>
  <span>${CONFIG.contact.location}</span>
`;
document.getElementById('nav-status').textContent = `Portfolio last updated ${today.getFullYear()}`;

/* ---------- hero ---------- */
document.getElementById('hero-kicker').textContent = CONFIG.role;
document.getElementById('hero-h1').textContent = CONFIG.tagline;
document.getElementById('hero-dek').textContent = CONFIG.aboutIntro.short;
document.getElementById('hero-byline').innerHTML = `
  <span>Reported by ${CONFIG.name}</span>
  <span>Filed from ${CONFIG.contact.location}</span>
`;
document.getElementById('hero-cap1').textContent = `${CONFIG.name} — ${CONFIG.role}`;
document.getElementById('hero-cap2').textContent = CONFIG.tagline;

/* ---------- stat strip ---------- */
const skillCount = CONFIG.skills.reduce((sum,g)=>sum+g.items.length,0);
const stats = [
  { n:"01", l:"Featured story" },
  { n:String(CONFIG.projects.length).padStart(2,'0'), l:"Selected projects" },
  { n:String(skillCount).padStart(2,'0'), l:"Areas of expertise" },
  { n:String(today.getFullYear()), l:"Current edition" }
];
document.getElementById('stat-strip').innerHTML = stats.map(s=>`
  <div class="strip__cell"><span class="strip__n">${s.n}</span><span class="strip__l mono">${s.l}</span></div>
`).join('');

/* ---------- award (editorial note) ---------- */
const A = CONFIG.award;
document.getElementById('award-eyebrow').textContent = A.eyebrow;
document.getElementById('award-headline').textContent = A.headline;
document.getElementById('award-excerpt').textContent = A.excerpt;
document.getElementById('award-excerpt2').textContent = A.excerpt2;

const awardPhotoImg = document.getElementById('award-photo-img');
const awardPhotoPlaceholder = document.getElementById('award-photo-placeholder');
document.getElementById('award-photo-caption').textContent = A.photo.caption;
if(A.photo.url){
  awardPhotoImg.src = A.photo.url;
  awardPhotoImg.style.display = 'block';
  awardPhotoPlaceholder.style.display = 'none';
} else {
  awardPhotoPlaceholder.innerHTML = iconSVG('award');
}

const awardReadMoreBtn = document.getElementById('award-read-more');
let awardExpanded = false;
awardReadMoreBtn.addEventListener('click', ()=>{
  awardExpanded = !awardExpanded;
  if(awardExpanded){
    const extra = document.createElement('div');
    extra.id = 'award-extra';
    extra.className = 'note__extra';
    extra.innerHTML = A.fullText.map(p=>`<p>${p}</p>`).join('');
    document.querySelector('.note__cols').insertBefore(extra, document.querySelector('.note__more'));
    awardReadMoreBtn.innerHTML = 'Show less <span class="arw" style="transform:rotate(180deg)">&rarr;</span>';
  } else {
    const extra = document.getElementById('award-extra');
    if(extra) extra.remove();
    awardReadMoreBtn.innerHTML = 'Read the article <span class="arw">&rarr;</span>';
  }
});

/* ---------- works teaser ---------- */
const W = CONFIG.works;
document.getElementById('works-title').textContent = W.eyebrow;
document.getElementById('works-meta').innerHTML = `<span>${CONFIG.projects.length} selected projects</span>`;
document.getElementById('works-blurb').textContent = W.blurb;

const worksPhotoImg = document.getElementById('works-photo-img');
const worksPhotoPlaceholder = document.getElementById('works-photo-placeholder');
document.getElementById('works-photo-caption').textContent = W.photo.caption;
if(W.photo.url){
  worksPhotoImg.src = W.photo.url;
  worksPhotoImg.style.display = 'block';
  worksPhotoPlaceholder.style.display = 'none';
} else {
  worksPhotoPlaceholder.innerHTML = iconSVG('works');
}

/* ---------- about teaser ---------- */
const AB = CONFIG.aboutIntro;
document.getElementById('about-eyebrow').textContent = AB.eyebrow;
document.getElementById('about-meta').innerHTML = `<span>About the designer</span>`;
document.getElementById('about-headline').textContent = AB.headline;
document.getElementById('about-short').textContent = AB.short;

const aboutPhotoImg = document.getElementById('about-photo-img');
const aboutPhotoPlaceholder = document.getElementById('about-photo-placeholder');
document.getElementById('about-photo-caption').textContent = CONFIG.aboutPhoto.caption;
if(CONFIG.aboutPhoto.url){
  aboutPhotoImg.src = CONFIG.aboutPhoto.url;
  aboutPhotoImg.style.display = 'block';
  aboutPhotoPlaceholder.style.display = 'none';
} else {
  aboutPhotoPlaceholder.innerHTML = iconSVG('about');
}

/* ---------- expertise (skills flattened into a numbered index) ---------- */
document.getElementById('expertise-title').textContent = CONFIG.expertise.headline;
document.getElementById('expertise-meta').innerHTML = `<span>${CONFIG.expertise.eyebrow}</span>`;
let flatSkills = [];
CONFIG.skills.forEach(group=>{
  group.items.forEach(item=>{ flatSkills.push({ item, group: group.name }); });
});
document.getElementById('expertise-grid').innerHTML = flatSkills.map((s,i)=>`
  <div class="index__row" role="listitem">
    <span class="n mono">${String(i+1).padStart(2,'0')}</span>
    <h3>${s.item}</h3>
    <span class="y mono">${s.group}</span>
  </div>
`).join('');

/* ---------- tools ---------- */
document.getElementById('tools-strip').innerHTML = CONFIG.tools.map(t=>`
  <div class="strip__cell strip__cell--tool">
    <span class="strip__icon">${toolIcon(t.logo)}</span>
    <span class="strip__l mono">${t.name}</span>
  </div>
`).join('');

/* ---------- contact ---------- */
const C = CONFIG.contact;
document.getElementById('contact-lede').textContent = C.lede;
document.getElementById('contact-email-cta').href = `mailto:${C.email}`;

const channelRows = [
  `<a href="mailto:${C.email}"><span>Email</span><span class="val">${C.email}</span><span class="arw">&rarr;</span></a>`,
  `<a href="tel:${C.phone.replace(/\s+/g,'')}"><span>Phone</span><span class="val">${C.phone}</span><span class="arw">&rarr;</span></a>`,
  `<span><span>Location</span><span class="val">${C.location}</span><span></span></span>`
].concat(C.socials.map(s=>`<a href="${s.url}" target="_blank" rel="noopener"><span>${s.label}</span><span class="val">${s.label}</span><span class="arw">&rarr;</span></a>`));
document.getElementById('contact-channels').innerHTML = channelRows.join('');

/* ---------- footer ---------- */
document.getElementById('foot-mast').innerHTML = `THE <span class="amp">${CONFIG.maskheadShort}</span> TIMES`;
document.getElementById('foot-meta').innerHTML = `
  <span>${CONFIG.name} — ${CONFIG.role}</span>
  <span>Set in Bodoni Moda, Newsreader &amp; IBM Plex Mono</span>
  <span>${C.finePrint}</span>
`;

/* ---------- reveal on scroll ---------- */
const revealTargets = document.querySelectorAll('.band, .hero, .strip, .foot, header#front');
if('IntersectionObserver' in window){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); }
    });
  }, { rootMargin:'0px 0px -10% 0px', threshold:0 });
  revealTargets.forEach(t=>io.observe(t));
} else {
  revealTargets.forEach(t=>t.classList.add('is-in'));
}
requestAnimationFrame(()=>{
  document.querySelector('.hero').classList.add('is-in');
  document.querySelector('header#front').classList.add('is-in');
});

/* ---------- current section in the nav ---------- */
const navLinks = [...document.querySelectorAll('.nav__list a')];
const navSections = navLinks.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);
if('IntersectionObserver' in window){
  const spy = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      navLinks.forEach(a=>a.setAttribute('aria-current', a.getAttribute('href') === '#' + e.target.id));
    });
  }, { rootMargin:'-45% 0px -50% 0px' });
  navSections.forEach(s=>spy.observe(s));
}

/* ---------- press-stamp cursor over case files / links ---------- */
const cursor = document.getElementById('cursor');
const fine = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
if(fine){
  let x=0,y=0,cx=0,cy=0,raf=null;
  const loop = ()=>{
    cx += (x-cx)*0.22; cy += (y-cy)*0.22;
    cursor.style.translate = `${cx}px ${cy}px`;
    raf = Math.abs(x-cx) > 0.4 || Math.abs(y-cy) > 0.4 ? requestAnimationFrame(loop) : null;
  };
  document.addEventListener('pointermove',(e)=>{
    x = e.clientX; y = e.clientY;
    if(!raf) raf = requestAnimationFrame(loop);
  }, { passive:true });
  document.addEventListener('pointerover',(e)=>{
    const hit = e.target.closest('[data-cursor]');
    if(!hit) return;
    cursor.innerHTML = hit.dataset.cursor;
    cursor.classList.add('on');
  });
  document.addEventListener('pointerout',(e)=>{
    if(e.target.closest('[data-cursor]')) cursor.classList.remove('on');
  });
}
</script>
</body>
</html>
