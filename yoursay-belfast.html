<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Your Say Belfast | Case Study | The JO Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,700;0,6..96,900;1,6..96,400;1,6..96,700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.cs-body{max-width:900px}
.cs-award{display:inline-block;margin-top:1.2em;padding:.5em .9em;border:1px solid var(--red);color:var(--red);letter-spacing:.14em;font-size:.72rem;text-transform:uppercase}
.cs-facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink);border-bottom:1px solid var(--rule-strong);margin:clamp(24px,3vw,40px) 0}
.cs-facts div{padding:14px 16px 14px 0}
.cs-facts dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.cs-facts dd{margin:.4em 0 0;font-size:1rem}
.cs-phase{margin:clamp(44px,5vw,76px) 0 0;padding-top:18px;border-top:3px solid var(--ink)}
.cs-phase .mono{display:block;margin-bottom:.5em}
.cs-phase h2{margin-bottom:.45em;font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,4.6vw,4.4rem);line-height:.9;letter-spacing:-.03em;text-transform:uppercase}
.cs-quote{margin:1.4em 0;padding:.2em 0 .2em 1.1em;border-left:4px solid var(--red);font-family:var(--display);font-style:italic;font-size:clamp(1.25rem,2.1vw,1.9rem);line-height:1.25}
.cs-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin:1.4em 0;border-top:1px solid var(--rule-strong);border-bottom:1px solid var(--rule-strong);padding:18px 0}
.cs-stats b{display:block;font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1;color:var(--red-deep)}
.cs-stats span{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.cs-list{margin:1em 0 1.2em;padding-left:1.1em}.cs-list li{margin-bottom:.5em}
.cs-two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin:1.2em 0}
.cs-two h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:.6em}
.cs-steps{counter-reset:s;margin:1.4em 0;border-top:1px solid var(--rule-strong)}
.cs-steps>div{display:grid;grid-template-columns:4.2em 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--rule)}
.cs-steps .n{font-family:var(--display);font-weight:900;font-size:2.2rem;color:var(--red)}
.cs-steps h4{font-family:var(--display);font-weight:700;font-size:1.5rem;text-transform:uppercase;margin-bottom:.3em}
.cs-steps p{margin:0}
.cs-figs{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,26px);margin:1.4em 0}
.cs-figs figure,.cs-figs .full{margin:0}.cs-figs .full{grid-column:1/-1}
.plate--auto{aspect-ratio:auto!important;min-height:140px}.plate--auto img{height:auto!important;display:block;object-fit:contain}
.cs-links{margin-top:clamp(40px,4vw,64px);padding-top:18px;border-top:1px solid var(--rule-strong);display:flex;gap:28px;flex-wrap:wrap}
@media (max-width:700px){.cs-facts{grid-template-columns:1fr 1fr}.cs-two,.cs-figs{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="shell">

  <header id="front">
    <div class="topbar mono">
      <span id="topbar-left"></span>
    </div>
    <div class="masthead">
      <div>
        <h1 class="masthead__title" id="masthead-title"></h1>
        <div class="masthead__sub">
          <span class="mono" id="masthead-role"></span>
          <span class="mono editor-note" id="masthead-tagline"></span>
        </div>
      </div>
      <div class="masthead__meta mono" id="masthead-meta"></div>
    </div>
    <nav class="nav" aria-label="Sections">
      <ul class="nav__list">
        <li><a href="index.html">Front Page</a></li>
        <li><a href="index.html#work">Works</a></li>
        <li class="nav__push"><a href="cv.pdf" download>CV</a></li>
        <li class="nav__cta"><a href="index.html#contact">Contact</a></li>
      </ul>
      <p class="nav__status mono"><span class="dot"></span> <span id="nav-status"></span></p>
    </nav>
  </header>

  <div class="band">
    <a class="link back" href="award.html">&larr; Back to the article</a>

    <div class="article-head">
      <p class="mono mono--l mono--red" id="article-eyebrow" style="margin-bottom:1.2em"></p>
      <h1 id="article-headline"></h1>
      <p class="article-byline mono" id="article-byline"></p>
    </div>

    <div class="article-body cs-body" id="article-body"></div>
  </div>

  <footer class="foot">
    <div class="foot__top">
      <p class="foot__mast" id="foot-mast"></p>
      <div class="foot__meta mono" id="foot-meta"></div>
    </div>
    <p class="endmark"><span>End of edition</span></p>
  </footer>

</div>

<script>
Promise.all([
  fetch('data/identity.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }),
  fetch('data/contact.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }),
  fetch('data/colors.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); }),
  fetch('data/yoursay.json?v=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json(); })
]).then(function(parts){
  var CONFIG = Object.assign.apply(Object, [{}].concat(parts));
  if (CONFIG.colors) {
    var root = document.documentElement.style;
    root.setProperty('--paper', CONFIG.colors.paper);
    root.setProperty('--paper-2', CONFIG.colors.paper2);
    root.setProperty('--ink', CONFIG.colors.ink);
    root.setProperty('--red', CONFIG.colors.red);
    root.setProperty('--red-deep', CONFIG.colors.redDeep);
  }
document.getElementById('topbar-left').textContent = `${CONFIG.name}, Independent Design Portfolio`;
document.getElementById('masthead-title').innerHTML = `THE <span class="amp">${CONFIG.maskheadShort}</span> TIMES`;
document.getElementById('masthead-role').textContent = CONFIG.role;
document.getElementById('masthead-tagline').textContent = CONFIG.editorNote;
document.getElementById('masthead-meta').innerHTML = `<span>${CONFIG.issueLine}</span><span>${CONFIG.contact.location}</span>`;
document.getElementById('nav-status').textContent = `Portfolio last updated ${new Date().getFullYear()}`;

const Y = CONFIG.yoursay;
document.getElementById('article-eyebrow').textContent = Y.eyebrow;
document.getElementById('article-headline').textContent = Y.title;
document.getElementById('article-byline').textContent = Y.byline;
document.querySelector('.article-head').insertAdjacentHTML('beforeend', `<span class="cs-award mono">${Y.award}</span>`);

function placeholderPhotoSVG(){
  return `<svg viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg"><circle cx="40" cy="30" r="10" fill="none" stroke="var(--ink)" stroke-width="2.5"/><path d="M4 84 L52 40 L82 66 L118 26 L156 84 Z" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
}
/* images that are not uploaded yet fall back to the placeholder instead of a broken icon */
window.imgMissing = function(img){
  var p = img.parentNode; p.classList.remove('plate--plain','plate--auto');
  p.innerHTML = '<div class="plate__icon">' + placeholderPhotoSVG() + '</div>';
};
function fig(f, cls){
  return `<figure class="${cls || ''}"><div class="plate article-plate plate--plain plate--auto"><img src="${f.src || f.url}" alt="${f.caption || ''}" loading="lazy" onerror="imgMissing(this)"></div><figcaption><span>${f.caption || ''}</span></figcaption></figure>`;
}
const li = a => `<ul class="cs-list">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
let html = `<div class="article-row split"><p class="drop-cap">${Y.abstract}</p>${fig(Y.cover)}</div>`;
html += `<dl class="cs-facts">${Y.facts.map(f=>`<div><dt>${f.k}</dt><dd>${f.v}</dd></div>`).join('')}</dl>`;
let pend = [];
const flush = () => { if(pend.length){ html += `<div class="cs-figs">${pend.map(f=>fig(f, f.size === 'full' ? 'full' : '')).join('')}</div>`; pend = []; } };
Y.blocks.forEach(b=>{
  if(b.t === 'fig'){
    pend.push(b);
    if(b.size === 'full') flush();
    else if(pend.length === 2) flush();
    return;
  }
  flush();
  if(b.t === 'h2') html += `<div class="cs-phase"><span class="mono mono--red">${b.kicker || ''}</span><h2>${b.text}</h2></div>`;
  else if(b.t === 'h3') html += `<h3 class="article-subhead">${b.text}</h3>`;
  else if(b.t === 'p') html += `<p>${b.text}</p>`;
  else if(b.t === 'list') html += li(b.items);
  else if(b.t === 'quote') html += `<blockquote class="cs-quote">&ldquo;${b.text}&rdquo;</blockquote>`;
  else if(b.t === 'stats') html += `<div class="cs-stats">${b.items.map(s=>`<div><b>${s.n}</b><span>${s.l}</span></div>`).join('')}</div>`;
  else if(b.t === 'two') html += `<div class="cs-two"><div><h4>${b.left.title}</h4>${li(b.left.items)}</div><div><h4>${b.right.title}</h4>${li(b.right.items)}</div></div>`;
  else if(b.t === 'steps') html += `<div class="cs-steps">${b.items.map(s=>`<div><span class="n">${s.n}</span><div><h4>${s.h}</h4><p>${s.p}</p></div></div>`).join('')}</div>`;
});
flush();
html += `<div class="cs-links mono"><a class="link" href="${Y.figma}" target="_blank" rel="noopener">View the Figma file <span class="arw">&rarr;</span></a><a class="link" href="award.html">Back to the article <span class="arw">&rarr;</span></a></div>`;
html += `<div class="article-close"><p class="mono mono--red">Up next</p><a class="article-close__title" href="case-study.html?p=ecocraft">EcoCraft <span class="arw">&rarr;</span></a><p class="article-close__line">A website that connects Belfast's local artisans with buyers, built around pop-up markets in unused spaces.</p></div>`;
document.getElementById('article-body').innerHTML = html;
/* ---------- Contact button changes to suit the page ---------- */
(function(title){
  var a = document.querySelector('.nav__cta a'); if(!a) return;
  var mail = 'mailto:' + CONFIG.contact.email + '?subject=' + encodeURIComponent('About ' + title + ' on your portfolio');
  a.textContent = "Like this? Let's talk"; a.href = mail;
})('Your Say Belfast');


document.getElementById('foot-mast').innerHTML = `THE <span class="amp">${CONFIG.maskheadShort}</span> TIMES`;
document.getElementById('foot-meta').innerHTML = `
  <span>${CONFIG.name}, ${CONFIG.role}</span>
  <span>Set in Bodoni Moda, Newsreader &amp; IBM Plex Mono</span>
  <span>${CONFIG.contact.finePrint}</span>
`;
const targets = document.querySelectorAll('.band, .foot, header#front');
if('IntersectionObserver' in window){
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('is-in'); io.unobserve(e.target); } });
  }, { rootMargin:'0px 0px -10% 0px', threshold:0 });
  targets.forEach(t=>io.observe(t));
} else { targets.forEach(t=>t.classList.add('is-in')); }
requestAnimationFrame(()=>{
  document.querySelector('header#front').classList.add('is-in');
  document.querySelector('.band').classList.add('is-in');
});
});
</script>
<script src="lightbox.js"></script>
</body>
</html>
