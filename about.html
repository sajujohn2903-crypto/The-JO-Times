<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About — The Design Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="grain-overlay"></div>

<nav class="masthead-nav" id="masthead-nav">
  <div class="nav-mark" id="nav-mark">THE <span>DESIGN</span> TIMES</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
  </ul>
</nav>

<main class="static-page">
  <div class="static-page-inner" style="max-width:900px;">
    <a class="back-link" href="index.html">&larr; Back to Home</a>

    <div class="article-card">
      <div class="section-eyebrow" id="about-article-eyebrow" style="text-align:center;">Profile</div>
      <h1 class="article-headline" id="about-article-headline">About Me</h1>
      <div class="article-byline" id="about-article-byline">By the Author</div>
      <div class="article-body" id="about-article-body"><!-- filled by JS --></div>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
document.getElementById('nav-mark').innerHTML = `THE <span>${CONFIG.maskheadShort}</span> TIMES`;

const AA = CONFIG.aboutArticle;
document.getElementById('about-article-eyebrow').textContent = AA.eyebrow;
document.getElementById('about-article-headline').textContent = AA.headline;
document.getElementById('about-article-byline').textContent = AA.byline;

// a simple drawn placeholder used for any image without a real url yet
function placeholderPhotoSVG(){
  return `<svg viewBox="0 0 160 90" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
    <rect width="160" height="90" fill="var(--muted)"/>
    <circle cx="34" cy="26" r="10" fill="var(--ink)" opacity="0.85"/>
    <path d="M0 90 L45 45 L75 70 L110 30 L160 90 Z" fill="var(--ink)" opacity="0.85"/>
  </svg>`;
}
function inlineImageHTML(img){
  const media = img.url
    ? `<img src="${img.url}" alt="">`
    : `<div class="placeholder-img">${placeholderPhotoSVG()}</div>`;
  return `<figure class="article-inline-image">${media}<figcaption>${img.caption}</figcaption></figure>`;
}

// build the article body in a fixed feature-page layout:
//   paragraph 1 — text left, image right (with the drop cap)
//   sub-headed sections — inserted here, between paragraphs 1 and 2
//   paragraph 2 — image left, text right
//   paragraph 3 — full-width text, image below it
//   any remaining paragraphs — plain full-width text
const paragraphs = CONFIG.about;
const images = CONFIG.aboutImages || [];
const subsections = CONFIG.aboutSubsections || [];
let bodyHtml = '';

if(paragraphs[0]){
  bodyHtml += `<div class="article-row split">
    <p class="drop-cap">${paragraphs[0]}</p>
    ${images[0] ? inlineImageHTML(images[0]) : ''}
  </div>`;
}
subsections.forEach(sub=>{
  bodyHtml += `<h3 class="article-subhead">${sub.heading}</h3><p>${sub.text}</p>`;
});
if(paragraphs[1]){
  bodyHtml += `<div class="article-row split">
    ${images[1] ? inlineImageHTML(images[1]) : ''}
    <p>${paragraphs[1]}</p>
  </div>`;
}
if(paragraphs[2]){
  bodyHtml += `<div class="article-row stacked">
    <p>${paragraphs[2]}</p>
    ${images[2] ? inlineImageHTML(images[2]) : ''}
  </div>`;
}
for(let i = 3; i < paragraphs.length; i++){
  bodyHtml += `<p>${paragraphs[i]}</p>`;
}
document.getElementById('about-article-body').innerHTML = bodyHtml;

// nav shadow on scroll, to match the home page's masthead behavior
window.addEventListener('scroll', ()=>{
  document.getElementById('masthead-nav').classList.toggle('scrolled', window.scrollY > 10);
});
</script>
</body>
</html>
